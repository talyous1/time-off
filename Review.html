<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
  <style>
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .head h1 { font-size: 26px; margin: 0; }
    .head p { margin: 4px 0 0; }
    .out { padding: 14px 16px; margin-bottom: 16px; }
    .out h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: Inter, sans-serif; font-weight: 600; }
    .out .people { display: flex; flex-wrap: wrap; gap: 8px; }
    .person { display: inline-flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; text-align: left; }
    .person b { font-size: 13.5px; }
    .person span { color: var(--muted); font-size: 12px; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat { padding: 14px 16px; cursor: pointer; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: var(--radius); }
    .stat:hover { border-color: var(--sage); }
    .stat.on { border-color: var(--deep); box-shadow: 0 0 0 1px var(--deep) inset; }
    .stat b { display: block; font: 800 28px/1.1 Montserrat, sans-serif; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 13px; color: var(--muted); font-weight: 500; }
    .s-p b { color: #B45309; } .s-i b { color: #C2410C; } .s-a b { color: #15803D; } .s-d b { color: #B91C1C; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar input { flex: 1 1 220px; }
    .toolbar select { width: auto; }
    .list { display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 0 16px; padding: 14px 16px; cursor: pointer; text-align: left; width: 100%; }
    .row:hover { border-color: var(--sage); }
    .row .title { font-weight: 600; font-size: 15.5px; margin: 3px 0 2px; }
    .row .meta { font-size: 13px; color: var(--muted); }
    .row .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; }
    .flag { font-size: 12px; font-weight: 600; color: #C2410C; }
    .pill.Cancelled { background: #EEF0EE; color: #4B5563; }

    .scrim { position: fixed; inset: 0; background: rgba(15,25,50,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 21; transform: translateX(100%); transition: transform .25s ease, visibility .25s; display: flex; flex-direction: column; visibility: hidden; }
    .drawer.show { transform: none; visibility: visible; box-shadow: -10px 0 40px rgba(0,0,0,.12); }
    .d-head { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 22px; }
    .d-head .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .d-head h2 { margin: 8px 0 4px; font-size: 21px; }
    .x { border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); }
    .d-body { flex: 1; overflow: auto; padding: 18px 22px 28px; display: grid; gap: 14px; align-content: start; }
    .sec { padding: 16px 18px; }
    .sec h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: Inter, sans-serif; font-weight: 600; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .fact { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .fact span { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .fact b { font-weight: 600; font-size: 14px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; font-size: 14px; margin: 0; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .also { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
    .decide textarea { margin-bottom: 12px; }
    .decide .btns { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
    .verdict { border-left: 4px solid var(--c); }
    .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13.5px; }
    .timeline li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
    .timeline i { width: 10px; height: 10px; border-radius: 50%; background: var(--sage); margin-top: 5px; }
    .denied-box { max-width: 460px; margin: 80px auto; padding: 32px; text-align: center; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .facts { grid-template-columns: 1fr 1fr; }
      .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; }
      .decide .btns { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; } .row .side { flex-direction: row; justify-content: flex-start; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="mark">HQA</div>
      <div class="brand">Time Off Approvals<small>HQA Spring · HR</small></div>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <main class="wrap" id="app"><div class="loading"><div class="spinner"></div>Loading requests…</div></main>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Request details"></aside>
  <div class="toast" id="toast"></div>

<script>
var state = { data: null, filter: 'Pending', q: '', openId: '', confirm: false };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pill(s) { return '<span class="pill ' + s.split(' ')[0] + '">' + esc(s) + '</span>'; }
function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 3200); }
function find(id) { return state.data.requests.filter(function (r) { return r.id === id; })[0]; }

function load() {
  google.script.run.withSuccessHandler(function (d) {
    if (d.denied) { $('app').innerHTML = '<div class="card denied-box"><h2>HR only</h2><p class="muted">You are signed in as <b>' + esc(d.email || 'an unknown account') + '</b>. Staff can request time off from the main page.</p></div>'; return; }
    state.data = d;
    $('who').innerHTML = (d.testMode ? '<span class="trial">Trial mode</span> ' : '') + (d.canDecide ? '' : '<span class="trial" style="background:#E5EAF4;color:#17377F">View only</span> ') + '<span>Signed in as </span><b style="color:#fff">' + esc(d.name) + '</b>';
    render();
    if (state.openId) open(state.openId);
  }).withFailureHandler(function (e) { $('app').innerHTML = '<div class="card denied-box"><h2>Something went wrong</h2><p class="muted">' + esc(e.message) + '</p></div>'; }).getReviewData();
}

function render() {
  var c = {}; state.data.requests.forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; });
  var stat = function (k, cls, label) { return '<button class="stat ' + cls + (state.filter === k ? ' on' : '') + '" data-f="' + k + '"><b>' + (c[k] || 0) + '</b><span>' + label + '</span></button>'; };
  var out = state.data.outSoon;
  $('app').innerHTML =
    '<div class="head"><div><h1>' + (state.filter === 'Pending' ? (state.data.canDecide ? 'Waiting for you' : 'Waiting for a decision') : esc(state.filter || 'All requests')) + '</h1><p class="muted">' +
      (state.filter === 'Pending' ? 'Soonest dates first.' : 'Newest requests first.') + '</p></div><button class="btn btn-ghost" id="refresh">Refresh</button></div>' +
    '<div class="card out"><h3>Out in the next 7 days</h3>' + (out.length ? '<div class="people">' + out.map(function (p) {
      return '<button class="person" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><span>' + esc(p.dateLabel) + ' · ' + esc(p.duration) + '</span></button>'; }).join('') + '</div>'
      : '<div class="small muted">Nobody has approved time off this week.</div>') + '</div>' +
    '<div class="stats">' + stat('Pending', 's-p', 'Pending') + stat('Needs Info', 's-i', 'Needs info') + stat('Approved', 's-a', 'Approved') + stat('Denied', 's-d', 'Denied') + '</div>' +
    '<div class="toolbar"><input type="text" id="q" placeholder="Search name, role, type or ID" value="' + esc(state.q) + '">' +
      '<select id="status"><option value="">All statuses</option><option>Pending</option><option>Needs Info</option><option>Approved</option><option>Denied</option><option>Cancelled</option></select></div>' +
    '<div class="list" id="list"></div>';
  $('status').value = state.filter;
  renderList();
  document.querySelectorAll('.stat').forEach(function (b) { b.onclick = function () { state.filter = state.filter === b.dataset.f ? '' : b.dataset.f; render(); }; });
  document.querySelectorAll('.person').forEach(function (b) { b.onclick = function () { open(b.dataset.id); }; });
  $('q').oninput = function (e) { state.q = e.target.value; renderList(); };
  $('status').onchange = function (e) { state.filter = e.target.value; render(); };
  $('refresh').onclick = function () { $('app').innerHTML = '<div class="loading"><div class="spinner"></div>Refreshing…</div>'; load(); };
}

function renderList() {
  var q = state.q.toLowerCase();
  var list = state.data.requests.filter(function (r) {
    return (!state.filter || r.status === state.filter) && (!q || (r.name + ' ' + r.role + ' ' + r.leaveType + ' ' + r.id).toLowerCase().indexOf(q) > -1);
  });
  if (state.filter === 'Pending') list.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  $('list').innerHTML = list.length ? list.map(function (r) {
    var flags = r.checks.filter(function (c) { return !c.ok; }).length;
    return '<button class="card row" data-id="' + esc(r.id) + '"><span><span class="tag" style="color:var(--sage-ink)">' + esc(r.leaveType) + '</span>' +
      '<div class="title">' + esc(r.name) + ' · ' + esc(r.shortDate) + '</div><div class="meta">' + esc(r.role) + ' · ' + esc(r.durationLabel) + ' · ' + esc(r.daysLabel) + '</div></span>' +
      '<span class="side">' + pill(r.status) + (flags && r.status === 'Pending' ? '<span class="flag">⚑ ' + flags + ' to check</span>' : '') + '<span class="small muted">' + esc(r.submittedLabel) + '</span></span></button>';
  }).join('') : '<div class="card empty"><b>All caught up.</b><div class="small">Nothing matches this view.</div></div>';
  document.querySelectorAll('.row').forEach(function (b) { b.onclick = function () { open(b.dataset.id); }; });
}

function open(id) {
  var r = find(id);
  if (!r) { toast('Request ' + id + ' was not found.'); return; }
  state.openId = id;
  var decided = r.status !== 'Pending';
  var vColor = { Approved: '#16A34A', 'Needs Info': '#EA580C', Denied: '#DC2626', Cancelled: '#6B7280' }[r.status];
  var d = $('drawer');
  d.innerHTML =
    '<div class="d-head"><div class="top"><span class="tag" style="color:var(--sage-ink)">' + esc(r.leaveType) + ' · <span class="muted" style="text-transform:none;letter-spacing:0">' + esc(r.id) + '</span></span>' +
      '<button class="x" id="close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' +
      '<h2>' + esc(r.name) + '</h2><div>' + pill(r.status) + ' <span class="small muted">' + esc(r.role) + ' · sent ' + esc(r.submittedLabel) + '</span></div></div>' +
    '<div class="d-body">' +
      '<div class="facts"><div class="fact"><span>Dates</span><b>' + esc(r.dateLabel) + '</b></div><div class="fact"><span>Duration</span><b>' + esc(r.durationLabel) + '</b></div>' +
        '<div class="fact"><span>Counts as</span><b>' + esc(r.daysLabel) + '</b><span style="text-transform:none;letter-spacing:0;margin-top:2px">' + r.usedThisYear + ' used this year</span></div></div>' +
      '<div class="card sec"><h3>Checks</h3><ul class="checks">' + r.checks.map(function (c) {
        return '<li class="' + (c.ok ? 'ok' : 'no') + '"><span class="dot">' + (c.ok ? '✓' : '!') + '</span><span><b>' + esc(c.label) + '</b>' + (c.detail ? ' <span class="muted">· ' + esc(c.detail) + '</span>' : '') + '</span></li>';
      }).join('') + '</ul></div>' +
      (r.overlaps.length ? '<div class="card sec"><h3>Also out</h3><ul class="also">' + r.overlaps.map(function (o) {
        return '<li><b>' + esc(o.name) + '</b> <span class="muted">· ' + esc(o.role) + ' · ' + esc(o.dateLabel) + ' · ' + esc(o.duration) + '</span> ' + pill(o.status) + '</li>'; }).join('') + '</ul></div>' : '') +
      (decided ? '<div class="card sec verdict" style="--c:' + vColor + '"><h3>Decision</h3><div>' + pill(r.status) + ' <span class="small muted">' + (r.status === 'Cancelled' ? 'by ' + esc(r.name) : 'by ' + esc(r.decidedBy) + ' · ' + esc(r.decidedLabel)) + '</span></div>' +
        (r.note ? '<p style="margin:10px 0 0;white-space:pre-wrap">' + esc(r.note) + '</p>' : '') +
        (r.status !== 'Cancelled' && state.data.canDecide ? '<p style="margin:12px 0 0"><a href="#" id="change" class="small">Change decision</a></p>' : '') + '</div>' : '') +
      (!state.data.canDecide && !decided ? '<div class="card sec"><h3>Decision</h3><div class="small muted">Waiting on HR or the Principal. You have view-only access.</div></div>' : '') +
      '<div class="card sec decide" id="decide"' + (decided || !state.data.canDecide ? ' hidden' : '') + '><h3>Your decision</h3>' +
        '<textarea id="note" placeholder="Note to ' + esc(r.name) + ' (required for “Needs info”, optional otherwise)"></textarea>' +
        '<div class="btns"><button class="btn btn-ok" data-d="Approved">Approve</button><button class="btn btn-warn" data-d="Needs Info">Needs info</button><button class="btn btn-bad" data-d="Denied">Deny</button></div></div>' +
      '<div class="card sec"><h3>Details</h3><dl class="kv">' +
        '<dt>Email</dt><dd><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></dd>' +
        '<dt>Coverage</dt><dd>' + esc([].concat(r.coverage || []).join(', ') || '—') + '</dd>' +
        (r.coverageNotes ? '<dt>Coverage notes</dt><dd>' + esc(r.coverageNotes) + '</dd>' : '') +
        '<dt>Reason</dt><dd>' + esc(r.reason || '—') + '</dd></dl></div>' +
      ((r.history || []).length ? '<div class="card sec"><h3>History</h3><ul class="timeline">' + r.history.slice().reverse().map(function (h) {
        return '<li><i></i><div><b>' + esc(h.action) + '</b> <span class="muted">· ' + esc(h.by) + ' · ' + new Date(h.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</span>' +
          (h.note ? '<div class="muted" style="white-space:pre-wrap">' + esc(h.note) + '</div>' : '') + '</div></li>'; }).join('') + '</ul></div>' : '') +
    '</div>';
  d.classList.add('show'); d.setAttribute('aria-hidden', 'false'); $('scrim').classList.add('show');
  $('close').onclick = close;
  if ($('change')) $('change').onclick = function (e) { e.preventDefault(); $('decide').hidden = false; $('note').focus(); this.parentNode.remove(); };
  d.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { decideIt(r, b.dataset.d); }; });
}

function close() { $('drawer').classList.remove('show'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('show'); state.openId = ''; }

function decideIt(r, decision) {
  var note = $('note').value.trim();
  if (decision === 'Needs Info' && !note) { $('note').focus(); toast('Add a note saying what you need to know.'); return; }
  var btns = document.querySelectorAll('[data-d]'); btns.forEach(function (b) { b.disabled = true; });
  google.script.run.withSuccessHandler(function (res) {
    btns.forEach(function (b) { b.disabled = false; });
    if (res.conflict) { toast('Already marked ' + res.status + ' by ' + res.decidedBy + '. Refresh to see it.'); return; }
    var i = state.data.requests.findIndex(function (x) { return x.id === r.id; });
    state.data.requests[i] = res.request;
    toast(decision === 'Approved' ? 'Approved. ' + r.name + ' has been emailed.' : decision === 'Denied' ? 'Denied. ' + r.name + ' has been emailed.' : 'Sent back to ' + r.name + ' with your question.');
    load();
  }).withFailureHandler(function (e) { btns.forEach(function (b) { b.disabled = false; }); toast(e.message); })
    .decideTimeOff(r.id, decision, note, r.status !== 'Pending');
}

$('scrim').onclick = close;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
google.script.url.getLocation(function (loc) {
  state.openId = (loc.parameter && loc.parameter.id) || '';
  if (state.openId) state.filter = '';
  load();
});
</script>
</body>
</html>
